<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Word Deck - Final Version</title>
    <style>
        :root {
            --primary-blue: #0071e3;
            --bg-gray: #f5f5f7;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --overlay-bg: rgba(0, 0, 0, 0.6);
        }

        body {
            font-family: "SF Pro Display", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            padding: 60px 20px;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        body.modal-open { overflow: hidden; }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        h1 { font-size: 40px; font-weight: 700; margin: 0; }

        .add-btn {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 980px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .add-btn:hover { transform: scale(1.05); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.4);
            min-height: 100px; 
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            background: #ffffff;
        }

        .card-category { font-size: 11px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; }
        .card-word { font-size: 24px; font-weight: 700; line-height: 1.2; margin-right: 30px; }

        .plus-icon {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 28px;
            height: 28px;
            background: #f5f5f7;
            color: #1d1d1f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* --- 修正ポイント：モーダルを真ん中に配置 --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay-bg);
            backdrop-filter: blur(15px);
            
            /* 上下左右の中央に配置 */
            justify-content: center;
            align-items: center;
            
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: white;
            width: 95%;
            max-width: 1000px;
            padding: 60px;
            border-radius: 36px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            animation: cardShow 0.4s ease-out;
            box-sizing: border-box;
            
            /* ×ボタンを配置するための基準点 */
            position: relative; 
            
            /* スマホ等で中身が長い場合にスクロール可能にする */
            max-height: 90vh;
            overflow-y: auto;
        }

        /* --- 修正ポイント：×ボタンを枠の角に配置 --- */
        .close-btn {
            /* fixedからabsoluteに変更 */
            position: absolute;
            /* 白枠（modal-content）の右上角からの距離 */
            top: 20px;
            right: 20px;
            
            width: 36px;
            height: 36px;
            background: #f5f5f7;
            color: #1d1d1f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
            z-index: 1001;
            border: 1px solid rgba(0,0,0,0.05);
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: #e8e8ed;
        }

        @keyframes cardShow {
            from { opacity: 0; transform: scale(0.98) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .form-layout {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .form-left { flex: 1; min-width: 300px; }
        .form-right { flex: 1.5; min-width: 300px; }

        input#newWord {
            font-size: 32px;
            font-weight: 700;
            width: 100%;
            border: 2px solid #f5f5f7;
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
            background-color: #fff;
        }

        textarea#newDetail {
            font-size: 18px;
            line-height: 1.6;
            width: 100%;
            min-height: 400px;
            background: #f5f5f7;
            border: none;
            border-radius: 20px;
            padding: 24px;
            box-sizing: border-box;
            resize: vertical;
        }

        input:focus, textarea:focus { 
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
        }

        .detail-category { font-size: 17px; color: var(--text-sub); margin-bottom: 12px; font-weight: 600; }
        .detail-word { font-size: 48px; font-weight: 800; margin-bottom: 30px; letter-spacing: -0.02em; }
        .detail-text { font-size: 20px; line-height: 1.7; color: #424245; margin-bottom: 50px; white-space: pre-wrap; }

        .delete-link { color: #ff3b30; font-size: 16px; cursor: pointer; font-weight: 500; opacity: 0.7; transition: 0.2s; }
        .delete-link:hover { opacity: 1; text-decoration: underline; }

        /* スマホ用調整：余白を少し詰める */
        @media (max-width: 600px) {
            .modal-content { padding: 40px 20px; }
            .detail-word { font-size: 32px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Library.</h1>
        <button class="add-btn" onclick="openAddModal()">Add Word</button>
    </header>
    <div class="grid" id="wordGrid"></div>
</div>

<div id="detailModal" class="modal-overlay" onclick="closeModals()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="close-btn" onclick="closeModals()">×</div>
        <div class="detail-category">Definitions</div>
        <div id="modalWord" class="detail-word"></div>
        <div id="modalText" class="detail-text"></div>
        <div style="display: flex; justify-content: flex-end;">
            <span class="delete-link" id="deleteBtn">Remove word</span>
        </div>
    </div>
</div>

<div id="addModal" class="modal-overlay" onclick="closeModals()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="close-btn" onclick="closeModals()">×</div>
        <div class="form-layout">
            <div class="form-left">
                <div class="detail-category">New Vocabulary</div>
                <input type="text" id="newWord" placeholder="Word">
            </div>
            <div class="form-right">
                <div class="detail-category">Description & Examples</div>
                <textarea id="newDetail" placeholder="Supports long text and line breaks..."></textarea>
            </div>
        </div>
        <button class="add-btn" style="width:100%; padding: 20px; font-size: 18px;" onclick="saveAndAdd()">Add to Library</button>
    </div>
</div>

<script>
    window.onload = loadWords;

    function loadWords() {
        const grid = document.getElementById('wordGrid');
        grid.innerHTML = '';
        const savedWords = JSON.parse(localStorage.getItem('myWords')) || [];
        savedWords.forEach((item, index) => addCardToUI(item.word, item.detail, index));
    }

    function showDetail(word, text, index) {
        document.getElementById('modalWord').innerText = word;
        document.getElementById('modalText').innerText = text;
        document.getElementById('deleteBtn').onclick = () => deleteWord(index);
        
        const modal = document.getElementById('detailModal');
        modal.style.display = 'flex';
        document.body.classList.add('modal-open');
    }

    function deleteWord(index) {
        if (!confirm("この単語を削除しますか？")) return;
        let savedWords = JSON.parse(localStorage.getItem('myWords')) || [];
        savedWords.splice(index, 1);
        localStorage.setItem('myWords', JSON.stringify(savedWords));
        closeModals();
        loadWords();
    }

    function openAddModal() {
        document.getElementById('addModal').style.display = 'flex';
        document.body.classList.add('modal-open');
        document.getElementById('newWord').focus();
    }

    function closeModals() {
        document.getElementById('detailModal').style.display = 'none';
        document.getElementById('addModal').style.display = 'none';
        document.body.classList.remove('modal-open');
    }

    function saveAndAdd() {
        const word = document.getElementById('newWord').value;
        const detail = document.getElementById('newDetail').value;
        if(!word) return alert("Word is required.");
        
        const savedWords = JSON.parse(localStorage.getItem('myWords')) || [];
        savedWords.push({ word, detail });
        localStorage.setItem('myWords', JSON.stringify(savedWords));
        
        loadWords();
        document.getElementById('newWord').value = '';
        document.getElementById('newDetail').value = '';
        closeModals();
    }

    function addCardToUI(word, detail, index) {
        const grid = document.getElementById('wordGrid');
        const newCard = document.createElement('div');
        newCard.className = 'card';
        newCard.onclick = () => showDetail(word, detail, index);
        newCard.innerHTML = `
            <div class="card-category">Voca.</div>
            <div class="card-word">${word}</div>
            <div class="plus-icon">+</div>
        `;
        grid.appendChild(newCard);
    }
</script>

</body>
</html>
